<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>college admission form</title>
</head>
<body>
    <h1>COLLEGE ADMISSION FORM</h1>
    <p>Please fill in your details carefully</p>
    <hr>

    <form action="">

        <label for="name">Full name</label><br>
        <input type="text"id="name"placeholder="Enter your Name">
        <br>
        <br>

        <label for="email">Email</label><br>
        <input type="email"id="email"placeholder="Enter your email">
        <br><br>

        <label for="password">Password</label>
        <input type="password"id="password"placeholder="create password">
        <br><br>

        <label for="phone">Phone number</label>
        <input type="number"id="number"placeholder="Enter your Phone Number">
        <br><br>

        <label for="dob">Date of Birth</label>
        <input type="date"id="dob">
        <br> <br>

        <label>Gender</label><br>

            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>

            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>

            <input type="radio" name="gender" id="other">
            <label for="other">Other</label>
            <br><br>

            <label for="course">Course</label><br>

            <select id="course" name="course">
                 <option>Select Course</option>
                 <option>BCA</option>
                 <option>B.Tech</option>
                 <option>BBA</option>
                 <option>B.Com</option>
            </select>
        <br><br>

        <label>Hobbies</label><br>

        <input type="checkbox" id="coding">
        <label for="coding">Coding</label>
        <input type="checkbox" id="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" id="sports">
        <label for="sports">Sports</label>
        <br><br>

        <label for="address">Address</label><br>
        <textarea id="address" rows="5" cols="40"></textarea>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
    <hr>
    </form>
</body>
</html>
